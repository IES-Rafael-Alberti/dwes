spring.application.name=catalogo-cultural-hibrido

# H2 in-memory for local development and test
spring.datasource.url=jdbc:h2:mem:catcultural
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# Development-only: Hibernate alters the schema from the entity model. This is
# unsafe for production and shared environments — real projects must rely on
# migrations or a validated schema instead of `ddl-auto=update`.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
