spring.application.name=catalogo-cultural-hibrido

# H2 in-memory for local development and test
spring.datasource.url=jdbc:h2:mem:catcultural
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# Development-only: Hibernate alters the schema from the entity model. This is
# unsafe for production and shared environments — real projects must rely on
# migrations or a validated schema instead of `ddl-auto=update`.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Cache / Caffeine
spring.cache.cache-names=openLibrarySearchResults
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=24h

# ---------------------------------------------------------------------------
# Open Library Search API client (P1B)
# ---------------------------------------------------------------------------
# Classroom-safe defaults: no API key (Open Library requires none for
# occasional human queries), low volume, bounded timeout.
catalogo.open-library.base-url=https://openlibrary.org
# Open Library requires a User-Agent identifying the application and a contact.
catalogo.open-library.user-agent=DWES-UD6/1.0 (docencia; contacto: <email-del-docente>)
catalogo.open-library.request-timeout=5s
# Maximum results returned per search; must stay between 1 and 10 (classroom-safe max).
catalogo.open-library.max-results=10
