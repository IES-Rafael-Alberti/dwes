site_name: Desarrollo Web en Entorno Servidor
site_description: Material del módulo DWES - Curso 2026/2027
site_url: https://ies-rafael-alberti.github.io/dwes/
repo_url: https://github.com/IES-Rafael-Alberti/dwes
repo_name: IES-Rafael-Alberti/dwes
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Solo material para el alumnado.
# 99-profesor, 90-archivo quedan fuera.
exclude_docs: |
  **/90-archivo/
  **/99-profesor/
  **/_profesor/
  **/README_Docente.md
  **/Presentaciones/
  **/correccion/
  **/Correccion/
  **/alumnos/
  **/soluciones/
  **/sol_*/
  **/.git/
  **/.idea/
  **/.settings/
  **/bin/
  **/vendor/
  **/node_modules/
  **/target/
  **/.gradle/
  **/build/
  ud05-laravel/02-ejemplos/sail/Laravel10-api/laravel-client/index.html
  ud05-laravel/03-ejercicios/Proyecto/*.html
  ud01-introduccion-entorno-servidor/01-documentacion/*.Rmd
  ud01-introduccion-entorno-servidor/01-documentacion/*.pdf
  ud01-introduccion-entorno-servidor/01-documentacion/UD1_Plan_Sesion3.md
  *.py
  *.csv
  *.zip
  *.tar.gz
  *.docx
  *.rmd
  *.Rhistory
  *.gift
  *.json
  *.gitignore
  *.gitattributes
  *.png
  *.jpg
  *.jpeg
  *.gif
  *.svg

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/IES-Rafael-Alberti/dwes

plugins:
  - search

hooks:
  - hooks/nav_generator.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
      title: En esta página

# El nav se genera automáticamente desde hooks/nav_generator.py
nav:
  - Inicio: index.md
