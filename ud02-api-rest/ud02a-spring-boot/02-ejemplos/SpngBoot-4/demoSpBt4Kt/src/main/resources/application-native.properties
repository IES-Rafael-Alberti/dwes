# ? Perfil optimizado para imagen nativa

# Desactiva el banner de arranque
spring.main.banner-mode=off

# Desactiva logs de arranque detallados
logging.level.root=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO

# Evita escaneo innecesario de beans
spring.main.lazy-initialization=true

# Desactiva DevTools (no compatible con GraalVM)
spring.devtools.restart.enabled=false

# Desactiva JMX (no compatible con imagen nativa)
spring.jmx.enabled=false

# Desactiva configuración de tiempo de arranque
spring.application.admin.enabled=false

# Evita reflexión en Jackson (si usas Jackson 3)
spring.jackson.visibility.field=ANY
spring.jackson.visibility.getter=NONE
spring.jackson.visibility.is-getter=NONE
spring.jackson.visibility.setter=NONE

# Desactiva métricas si no usas observabilidad
management.simple.metrics.export.enabled=false
management.endpoints.web.exposure.include=health,info

# Puerto alternativo para pruebas
server.port=8081