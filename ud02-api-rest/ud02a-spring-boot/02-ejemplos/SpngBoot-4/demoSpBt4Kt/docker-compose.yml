version: '3.8'
services:
  kotlin-jvm:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=kotlin

  kotlin-native:
    build:
      context: .
      dockerfile: Dockerfile.native
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=native