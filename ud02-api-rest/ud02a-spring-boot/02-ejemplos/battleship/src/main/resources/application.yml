spring:
  application:
    name: battleship
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
server:
  servlet:
    application-display-name: ""

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs/battleship-v1.yaml
    disable-swagger-default-url: true
    try-it-out-enabled: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${BATTLESHIP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      issuer: battleship-api
      audience: battleship-client
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
