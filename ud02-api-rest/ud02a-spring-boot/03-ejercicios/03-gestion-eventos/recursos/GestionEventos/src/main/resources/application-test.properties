# Perfil: test (para ejecutar pruebas unitarias/integración)

# H2 en memoria, aislado para tests
spring.datasource.url=jdbc:h2:mem:gestioneventos_test;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Esquema limpio por prueba/sesión
spring.jpa.hibernate.ddl-auto=create-drop

# No cargar data.sql automáticamente en tests
spring.sql.init.mode=never

# Consola H2 no necesaria en tests
spring.h2.console.enabled=false

# Logging más silencioso en tests (ajusta a tu gusto)
logging.level.root=INFO
logging.level.org.springframework=INFO
