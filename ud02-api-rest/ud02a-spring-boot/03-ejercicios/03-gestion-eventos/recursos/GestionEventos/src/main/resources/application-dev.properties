# Perfil: desarrollo (dev)

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:gestioneventos_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Carga de scripts SQL si existen (schema.sql/data.sql)
spring.sql.init.mode=always

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging útil en desarrollo (opcional)
# logging.level.org.hibernate.SQL=debug
# logging.level.org.hibernate.orm.jdbc.bind=trace

# Parámetros de seeding (usados por DataInitializer)
# Puedes ajustar estos valores para generar más/menos datos falsos en dev
seed.organizadores=8
seed.eventos=16
seed.participantes=40
