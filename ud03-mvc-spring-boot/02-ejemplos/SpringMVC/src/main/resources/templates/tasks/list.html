<!doctype html><html lang="en"><head><meta charset="utf-8"><title>My tasks</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><header><h1>My tasks</h1><form th:action="@{/logout}" method="post"><button>Sign out</button></form></header><p><a th:href="@{/tasks/new}">New task</a></p><p th:if="${#lists.isEmpty(tasks)}">No tasks yet.</p><ul><li th:each="task : ${tasks}"><span th:text="${task.description}"></span> <strong th:text="${task.completed ? 'Completed' : 'Pending'}"></strong> <a th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a><form class="inline" th:action="@{/tasks/{id}/toggle(id=${task.id})}" method="post"><button>Toggle</button></form><form class="inline" th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post"><button>Delete</button></form></li></ul></main></body></html>
