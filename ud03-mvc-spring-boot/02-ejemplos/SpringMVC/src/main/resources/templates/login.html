<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main><h1>Sign in</h1><p th:if="${param.error}">Invalid credentials.</p><p th:if="${param.logout}">You have signed out.</p><form th:action="@{/login}" method="post"><label>Username <input name="username" autocomplete="username" required></label><label>Password <input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></main></body></html>
